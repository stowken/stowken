[workspace]
members = [
    "crates/stowken",
    "crates/stowken-enterprise",
    "crates/stowken-python",
    "crates/stowken-node",
    "crates/stowken-cli",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zstd = "0.13"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
tracing = "0.1"
stowken = { path = "crates/stowken" }
