name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # ── 1. Publish core library to crates.io ──────────────────────────────────
  publish-crate-core:
    name: crates.io — stowken
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Publish stowken
        run: cargo publish -p stowken --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── 2. Publish CLI to crates.io (after core lands) ────────────────────────
  publish-crate-cli:
    name: crates.io — stowken-cli
    runs-on: ubuntu-latest
    needs: publish-crate-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Give the registry index time to see the freshly-published core crate
      - name: Wait for core crate to be indexed
        run: sleep 30

      - name: Publish stowken-cli
        run: cargo publish -p stowken-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── 3. Build Python wheels (multi-platform) ───────────────────────────────
  python-wheels:
    name: Python wheels — ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          # Linux aarch64 (cross-compiled)
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
          # macOS arm64 (Apple Silicon)
          - os: macos-latest
            target: aarch64
            manylinux: auto
          # macOS x86_64
          - os: macos-latest
            target: x86_64
            manylinux: auto
          # Windows x86_64
          - os: windows-latest
            target: x86_64
            manylinux: auto
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: crates/stowken-python
          args: --release --out dist --interpreter 3.8 3.9 3.10 3.11 3.12 3.13
          sccache: true

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: crates/stowken-python/dist/*.whl

  # ── 4. Build pure-Python sdist ────────────────────────────────────────────
  python-sdist:
    name: Python sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: crates/stowken-python
          args: --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/stowken-python/dist/*.tar.gz

  # ── 5. Publish to PyPI ────────────────────────────────────────────────────
  publish-pypi:
    name: PyPI — stowken
    runs-on: ubuntu-latest
    needs: [python-wheels, python-sdist]
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ── 6. GitHub Release ─────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-crate-cli, publish-pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        run: |
          awk "/^## ${{ steps.version.outputs.version }}/,/^## [0-9]/" CHANGELOG.md \
            | head -n -1 \
            | tail -n +2 > release_notes.md
          echo "notes_path=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*.whl
          generate_release_notes: false
