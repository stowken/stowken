[package]
name = "stowken-cli"
version = "0.6.1"
edition = "2021"
description = "Command-line interface for Stowken"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stowken/stowken"
default-run = "stowken"

[[bin]]
name = "stowken"
path = "src/main.rs"

[dependencies]
stowken = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
indicatif = "0.17"
tabled = "0.15"
directories = "5"

[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }
