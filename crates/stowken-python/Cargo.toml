[package]
name = "stowken-python"
version = "0.7.0"
edition = "2021"
description = "Python bindings for Stowken"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stowken/stowken"

[lib]
name = "stowken"
crate-type = ["cdylib"]

[dependencies]
stowken = { workspace = true, features = ["s3"] }
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py38"] }
pyo3-async-runtimes = { version = "0.21", features = ["tokio-runtime"] }
tokio = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[features]
default = ["semantic-search"]
semantic-search = ["stowken/semantic-search"]
