[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "stowken"
version = "0.6.1"
description = "Compressed, deduplicated, queryable storage for LLM conversations"
readme = "../../README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.8"
authors = [{ name = "Ben DiMattia", email = "brdimattia@gmail.com" }]
keywords = ["llm", "tokens", "compression", "storage", "deduplication"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Archiving :: Compression",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/stowken/stowken"
Repository = "https://github.com/stowken/stowken"
"Bug Tracker" = "https://github.com/stowken/stowken/issues"
Changelog = "https://github.com/stowken/stowken/blob/master/CHANGELOG.md"

[project.optional-dependencies]
databricks = [
    "pyspark>=3.5",
    "delta-spark>=3.0",
    "databricks-sdk>=0.20",
    "databricks-vectorsearch>=0.40",
]

[tool.maturin]
python-source = "python"
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"
