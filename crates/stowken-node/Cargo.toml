[package]
name = "stowken-node"
version = "0.1.0"
edition = "2021"
description = "Node.js bindings for Stowken"

[lib]
crate-type = ["cdylib"]

[dependencies]
stowken = { workspace = true }
napi = { version = "2", features = ["napi4", "tokio_rt", "serde-json"] }
napi-derive = "2"
tokio = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2"
